name: Issue triage

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    if: >-
      !github.event.issue.pull_request &&
      ((github.event_name == 'issue_comment' && github.event.action == 'created') ||
       (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ai: needs-triage'))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.command.outputs.mode }}
      comment-id: ${{ steps.command.outputs.comment-id }}
    steps:
      - name: Recognize the triage request
        id: command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { comment, label } = context.payload;
            const requested = context.eventName === 'issues'
              ? label?.name === 'ai: needs-triage'
              : comment?.body?.trim().toLowerCase() === '@claude triage';
            if (requested) {
              core.setOutput('mode', 'triage');
              core.setOutput('comment-id', context.eventName === 'issue_comment' ? comment.id : 0);
            }

  triage:
    needs: request
    if: needs.request.outputs.mode != ''
    # Maximum grant required by the reusable workflow; its model-running jobs use read-only GitHub tokens.
    # This caller enables triage only. Fix and publisher jobs remain disabled.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: mui/mui-public/.github/workflows/claude-triage.yml@da1ead5057fe07e37e1af73d0b1e0fdcee620a9a
    with:
      issue-number: ${{ github.event.issue.number }}
      mode: ${{ needs.request.outputs.mode }}
      comment-id: ${{ fromJSON(needs.request.outputs.comment-id) }}
      triage-model: claude-haiku-5-5
      triage-max-turns: 60
