name: Claude issue triage

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acknowledge:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude triage') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Acknowledge the triage request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

  agent:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude triage') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      issues: read
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Triage in Cloudflare Sandbox
        uses: brijeshb42/claude-triage-action@f0bc2d9f3430236bf50512457f129a6c5031d86c
        with:
          sandbox-api-url: ${{ vars.SANDBOX_API_URL }}
          sandbox-api-key: ${{ secrets.SANDBOX_API_KEY }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github-token: ${{ github.token }}
          issue-number: ${{ github.event.issue.number }}
          artifact-name: claude-triage-${{ github.event.issue.number }}-${{ github.run_id }}
          model: claude-sonnet-4-6
          preview-directory: examples/triage-preview
          show-full-output: true
          snapshot-excludes: docs/public

  mark-agent-finished:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Mark sandbox triage as finished
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_RESULT: ${{ needs.agent.result }}
        with:
          script: |
            const target = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
            };
            const { data: reactions } = await github.rest.reactions.listForIssueComment({
              ...target,
              per_page: 100,
            });
            const statusReactions = reactions.filter(
              (reaction) =>
                reaction.user?.login === 'github-actions[bot]' &&
                ['eyes', 'rocket', 'hooray', 'confused'].includes(reaction.content),
            );
            await Promise.all(
              statusReactions.map((reaction) =>
                github.rest.reactions.deleteForIssueComment({
                  ...target,
                  reaction_id: reaction.id,
                }),
              ),
            );
            await github.rest.reactions.createForIssueComment({
              ...target,
              content: process.env.AGENT_RESULT === 'success' ? 'rocket' : 'confused',
            });

  publish:
    needs: [agent, mark-agent-finished]
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository with publisher credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and publish triage result
        uses: brijeshb42/claude-triage-action/publish@f0bc2d9f3430236bf50512457f129a6c5031d86c
        with:
          artifact-name: claude-triage-${{ github.event.issue.number }}-${{ github.run_id }}
          github-token: ${{ github.token }}
          issue-number: ${{ github.event.issue.number }}
          default-branch: ${{ github.event.repository.default_branch }}
          preview-directory: examples/triage-preview

  mark-finished:
    needs: [acknowledge, agent, publish]
    if: always() && needs.acknowledge.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Mark triage as finished
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_RESULT: ${{ needs.agent.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const target = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
            };
            const { data: reactions } = await github.rest.reactions.listForIssueComment({
              ...target,
              per_page: 100,
            });
            const statusReactions = reactions.filter(
              (reaction) =>
                reaction.user?.login === 'github-actions[bot]' &&
                ['eyes', 'rocket', 'hooray', 'confused'].includes(reaction.content),
            );
            await Promise.all(
              statusReactions.map((reaction) =>
                github.rest.reactions.deleteForIssueComment({
                  ...target,
                  reaction_id: reaction.id,
                }),
              ),
            );
            const succeeded =
              process.env.AGENT_RESULT === 'success' && process.env.PUBLISH_RESULT === 'success';
            await github.rest.reactions.createForIssueComment({
              ...target,
              content: succeeded ? 'hooray' : 'confused',
            });
