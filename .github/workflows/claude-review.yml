name: Claude issue triage

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acknowledge:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude triage') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Acknowledge the triage request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

  agent:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude triage') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      issues: read
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Triage in Cloudflare Sandbox
        uses: brijeshb42/claude-triage-action@d395009faacabe316ab322946cfa073fb9da9245
        with:
          sandbox-api-url: ${{ vars.SANDBOX_API_URL }}
          sandbox-api-key: ${{ secrets.SANDBOX_API_KEY }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github-token: ${{ github.token }}
          issue-number: ${{ github.event.issue.number }}
          artifact-name: claude-triage-${{ github.event.issue.number }}-${{ github.run_id }}
          model: claude-sonnet-4-6
          max-turns: 200
          preview-directory: examples/triage-preview
          show-full-output: false
          snapshot-excludes: docs/public

  publish:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Create publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLAUDE_TRIAGE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_TRIAGE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Check out repository with publisher credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.publisher-token.outputs.token }}

      - name: Validate and publish triage result
        uses: brijeshb42/claude-triage-action/publish@d395009faacabe316ab322946cfa073fb9da9245
        with:
          artifact-name: claude-triage-${{ github.event.issue.number }}-${{ github.run_id }}
          github-token: ${{ steps.publisher-token.outputs.token }}
          issue-number: ${{ github.event.issue.number }}
          default-branch: ${{ github.event.repository.default_branch }}
          preview-directory: examples/triage-preview
