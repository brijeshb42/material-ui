name: CI

on:
  push:
    branches:
      # should sync with ci-check.yml as a workaround to bypass github checks
      - master
      - next
      - v*.x
  pull_request:
    paths-ignore:
      # should sync with ci-check.yml as a workaround to bypass github checks
      - 'docs/**'

permissions: {}

jobs:
  # Tests dev-only scripts across all supported dev environments
  test-dev:
    # l10nbot does not affect dev scripts.
    if: ${{ github.actor != 'l10nbot' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: read
    steps:
      - run: echo '${{ github.actor }}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch all tags which are required for `pnpm release:changelog`
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'pnpm' # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-dependencies
      - run: pnpm install
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.js', 'docs/**/*.ts', 'docs/**/*.tsx', 'docs/**/*.jsx', 'docs/**/*.json', 'docs/**/*.md', 'docs/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - run: pnpm release:build
      - name: Publish packages to pkg.pr.new
        id: publish-packages
        uses: ./.github/actions/ci-publish
        if: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Upload triage preview metadata
        if: >-
          matrix.os == 'ubuntu-latest' &&
          github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.publish-packages.outputs.metadata-path }}
          if-no-files-found: error
          retention-days: 1
      - name: Build docs
        run: pnpm docs:build
        env:
          NODE_OPTIONS: --max_old_space_size=6144
          # macOS-latest has 3 CPUs, but we get "EMFILE: too many open files" errors with that parallelism
          # Limit Next.js to 2 CPUs to prevent file descriptor exhaustion. Empty string uses os.availableParallelism()
          NEXT_PARALLELISM: ${{ runner.os == 'macOS' && '2' || '' }}
          GITHUB_AUTH: Bearer ${{ secrets.GITHUB_TOKEN }}
      # - run: pnpm release:changelog
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug export-detail.json on when pnpm docs:build fails with EMFILE error
        if: failure()
        run: cat ./docs/.next/export-detail.json || true
      - name: Extract Vale version
        if: ${{ matrix.os == 'ubuntu-latest' }}
        id: vale-version
        run: |
          VERSION=$(node -p "(require('./package.json').config && require('./package.json').config.valeVersion) || ''")
          echo "vale_version=$VERSION" >> $GITHUB_OUTPUT
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        continue-on-error: true # GitHub Action flag needed until https://github.com/errata-ai/vale-action/issues/89 is fixed
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          version: ${{ steps.vale-version.outputs.vale_version }}
          # Errors should be more visible
          fail_on_error: true
          # The other reports don't work, not really https://github.com/reviewdog/reviewdog#reporters
          reporter: github-pr-check
          # Required, set by GitHub actions automatically:
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#about-the-github_token-secret
          token: ${{secrets.GITHUB_TOKEN}}

  report-triage-preview:
    name: Report triage preview
    if: github.event_name == 'pull_request'
    needs: test-dev
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download pkg.pr.new metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: triage-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/triage-preview
      - name: Validate and publish the StackBlitz URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          METADATA_PATH: ${{ runner.temp }}/triage-preview/pkg-pr-new-output.json
          PREVIEW_DIRECTORY: examples/triage-preview
          PREVIEW_PACKAGE: material-ui-triage-preview
        with:
          script: |
            const fs = require('fs');
            const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
            if (!Array.isArray(metadata.packages) || !Array.isArray(metadata.templates)) {
              throw new Error('pkg.pr.new metadata does not match the expected schema.');
            }

            const pullNumber = context.payload.pull_request.number;
            const eventHeadSha = context.payload.pull_request.head.sha;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pullRequest.head.sha !== eventHeadSha) {
              core.notice('Skipping a stale preview result for an older pull request head.');
              return;
            }

            const labels = new Set(pullRequest.labels.map((label) => label.name));
            if (!labels.has('claude-triage') || !labels.has('claude-triage-preview')) {
              core.notice('The pull request is not a validated triage preview.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const previewPrefix = `${process.env.PREVIEW_DIRECTORY}/`;
            if (!files.some((file) => file.filename.startsWith(previewPrefix))) {
              throw new Error('The configured preview directory did not change.');
            }

            const template = metadata.templates.find(
              (candidate) => candidate?.name === process.env.PREVIEW_PACKAGE,
            );
            if (!template || typeof template.url !== 'string') {
              throw new Error('pkg.pr.new did not generate the configured preview template.');
            }
            const previewUrl = new URL(template.url);
            if (previewUrl.origin !== 'https://pkg.pr.new') {
              throw new Error(`Refusing an unexpected preview URL origin: ${previewUrl.origin}`);
            }

            const shortSha = eventHeadSha.slice(0, 7);
            const previewLine = `**StackBlitz preview (${shortSha}):** ${previewUrl.href}`;
            const prMarker = '<!-- claude-triage-preview -->';
            const prCommentBody = [
              prMarker,
              '## Triage preview',
              '',
              previewLine,
              '',
              'This preview corresponds exactly to the current pull request head. The final commit is disposable and should normally be removed before merge.',
            ].join('\n');
            const prComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existingPrComment = prComments.find((comment) => comment.body?.includes(prMarker));
            if (existingPrComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingPrComment.id,
                body: prCommentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body: prCommentBody,
              });
            }

            const issueMatch = pullRequest.body?.match(/<!-- claude-triage-issue:(\d+) -->/);
            if (!issueMatch) {
              throw new Error('The triage pull request does not identify its source issue.');
            }
            const issueNumber = Number(issueMatch[1]);
            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const triageMarker = '<!-- claude-cloudflare-triage -->';
            const previewStatusMarker = '<!-- claude-triage-preview-status -->';
            const triageComment = issueComments.find((comment) => comment.body?.includes(triageMarker));
            if (triageComment) {
              const body = triageComment.body.includes(previewStatusMarker)
                ? triageComment.body.replace(
                    /<!-- claude-triage-preview-status -->\n[^\n]*/,
                    `${previewStatusMarker}\n${previewLine}`,
                  )
                : `${triageComment.body}\n\n${previewStatusMarker}\n${previewLine}`;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: triageComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `<!-- claude-triage-preview-issue -->\n${previewLine}`,
              });
            }

  # Mirrors the real publish workflow environment (`publish.yml`) so an env
  # mismatch — e.g. the Node version pinned by `publish-prepare` violating our
  # engineStrict `engines` range — is caught here instead of during publishing.
  publish-dry-run:
    name: Publish Dry Run

    if: ${{ github.repository_owner == 'mui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare for publishing
        uses: mui/mui-public/.github/actions/publish-prepare@487b5aad17ff4335a4863ac74b0e08e501947184 # master
        with:
          node-version: '22.23.2'
      - name: Dry run npm publishing
        env:
          IS_PUBLISH_TEST: 'true'
        run: pnpm code-infra publish --ci --dry-run
