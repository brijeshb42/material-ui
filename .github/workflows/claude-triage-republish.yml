name: Republish Claude triage artifact

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Workflow run containing the triage artifact
        required: true
        type: string
      issue-number:
        description: Issue that triggered the triage run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the existing triage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: claude-triage-${{ inputs.issue-number }}-${{ inputs.source-run-id }}
          path: ${{ runner.temp }}/source-triage
          run-id: ${{ inputs.source-run-id }}

      - name: Attach the artifact to this publisher run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-triage-${{ inputs.issue-number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source-triage

      - name: Create publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLAUDE_TRIAGE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_TRIAGE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Check out repository with publisher credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.publisher-token.outputs.token }}

      - name: Validate and publish triage result
        uses: brijeshb42/claude-triage-action/publish@d395009faacabe316ab322946cfa073fb9da9245
        with:
          artifact-name: claude-triage-${{ inputs.issue-number }}-${{ github.run_id }}
          github-token: ${{ steps.publisher-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
          default-branch: ${{ github.event.repository.default_branch }}
          preview-directory: examples/triage-preview
